services:
  backend:
    container_name: "backend"
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  frontend:
    container_name: "frontend"
    build:
      context: ./frontend
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:80"
 