name: Train with Taku Backend

on:
    # run pipeline if pull request made to main or dev
    # (this excludes deployment steps)
    pull_request:
        branches:
            - main
            - dev
        paths:
            - 'backend/**'
            - '.github/workflows/**'
    push:
        # run pipeline if attempted push/merge occurs on main or dev
        branches:
            - main
            - dev
        # only execute pipeline if changes made on the backend path or workflows path
        paths:
            - 'backend/**'
            - '.github/workflows/**'

permissions:
    contents: read
    id-token: write

env:
    IMAGE_NAME: trainwithtaku-backend
    DEV_NAME: trainwithtaku-backend-dev
    PROD: trainwithtaku-backend-prod
    GOOGLE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
    # Artifact registry location
    GCP_ARL: europe-west2
    # Artifact registry repo name
    AR_REPO: trainwithtaku

jobs:
    test:
        # run on ubuntu (linux) operating system
        runs-on: ubuntu-latest
        defaults:
            # setting working directory at job level to avoid needing to type
            # ...working-directory: backend on every stage in the job
            run:
                working-directory: ./backend/

        strategy:
            matrix:
                python-version: ['3.12', '3.13']

        steps:
            - uses: actions/checkout@v6

            # installs uv and pins python version - replaces setup-python + separate uv install
            - name: Set up uv and Python
              uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
              with:
                version: "0.11.17"
                
            - name: Install dependencies
              run: uv sync --locked

            - name: Run tests
              run: uv run pytest -m "not llm_call and not slow and not rate_limit and not mongodb"
              env:
                MONGO_DB_CONNECTION_STRING: ${{ secrets.MONGO_DB_CONNECTION_STRING }}
                OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
                JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM }}
                TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
                TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
                TEST_CONVERSATION_ID: ${{ secrets.TEST_CONVERSATION_ID }}
                REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
                TEST_REDIS_PASSWORD: ${{ secrets.TEST_REDIS_PASSWORD }}
                MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
                APP_ENVIRONMENT: dev
        
    build-and-push:
        # run on ubuntu (linux) OS
        runs-on: ubuntu-latest
        # only run if test passes
        needs: test
        # only run if it's a push
        if: github.event_name == 'push'

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Authenticate to Google Cloud (OIDC)
              uses: google-github-actions/auth@v2
              with:
                # get workload identity provider and GCP service account emai
                workload_identity_provider: ${{ secrets.GCP_WIP }}
                service_account: ${{ secrets.SA_EMAIL }}
            
            - name: Build and push docker image

            # build and push docker image with two tag names (one with git SHA and one with 'latest') - tracking version no.
              run: |
                gcloud auth configure-docker ${GCP_ARL}-docker.pkg.dev
                
                docker build \
                -t ${GCP_ARL}-docker.pkg.dev/${GOOGLE_PROJECT}/${AR_REPO}/${IMAGE_NAME}:latest \
                -t ${GCP_ARL}-docker.pkg.dev/${GOOGLE_PROJECT}/${AR_REPO}/${IMAGE_NAME}:${{ github.sha }} \
                 -f ./backend/Dockerfile ./backend
                
                docker push ${GCP_ARL}-docker.pkg.dev/${GOOGLE_PROJECT}/${AR_REPO}/${IMAGE_NAME}:latest
                docker push ${GCP_ARL}-docker.pkg.dev/${GOOGLE_PROJECT}/${AR_REPO}/${IMAGE_NAME}:${{ github.sha }}
    dev-deploy:
        runs-on: ubuntu-latest

        # only run if in dev and it's from a push
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        needs: build-and-push

        steps:
            - name: Authenticate to Google Cloud (OIDC)
              uses: google-github-actions/auth@v2
              with:
                # get workload identity provider and GCP service account emai
                workload_identity_provider: ${{ secrets.GCP_WIP }}
                service_account: ${{ secrets.SA_EMAIL }}

            - name: Deploy dev backend to gcloud run
              run: |
                gcloud run deploy ${DEV_NAME} \
                --allow-unauthenticated \
                --image ${GCP_ARL}-docker.pkg.dev/${GOOGLE_PROJECT}/${AR_REPO}/${IMAGE_NAME}:${{ github.sha }} \
                --set-env-vars "MONGO_DB_CONNECTION_STRING=${{ secrets.MONGO_DB_CONNECTION_STRING }},OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }},JWT_ALGORITHM=${{ secrets.JWT_ALGORITHM }},REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }},MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }},APP_ENVIRONMENT=dev" \
                --port 8000 \
                --region ${GCP_ARL} \
                --platform managed \
                --project ${GOOGLE_PROJECT}

    prod-deploy:

        runs-on: ubuntu-latest
        needs: build-and-push

        # only run if in dev and it's from a push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'

        steps:
            - name: Authenticate to Google Cloud (OIDC)
              uses: google-github-actions/auth@v2
              with:
                # get workload identity provider and GCP service account emai
                workload_identity_provider: ${{ secrets.GCP_WIP }}
                service_account: ${{ secrets.SA_EMAIL }}
                
            - name: Deploy prod backend to gcloud run
              run: |
                gcloud run deploy ${PROD_NAME} \
                --allow-unauthenticated \
                --image ${GCP_ARL}-docker.pkg.dev/${GOOGLE_PROJECT}/${AR_REPO}/${IMAGE_NAME}:${{ github.sha }} \
                --set-env-vars "MONGO_DB_CONNECTION_STRING=${{ secrets.MONGO_DB_CONNECTION_STRING }},OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }},JWT_ALGORITHM=${{ secrets.JWT_ALGORITHM }},REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }},MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }},APP_ENVIRONMENT=prod" \
                --port 8000 \
                --region ${GCP_ARL} \
                --platform managed \
                --project ${GOOGLE_PROJECT}
    
    






        
                
